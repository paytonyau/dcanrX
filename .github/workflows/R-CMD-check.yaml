# Standard R package CI, adapted from the r-lib/actions examples.
#
# NOTE: this workflow has never been executed — the development
# environment for this package had no network access to GitHub Actions.
# It is provided as a sensible starting point and is expected to need
# adjustment on its first real run (most likely around the Bioconductor
# Suggests dependencies, which are heavy and may need caching or
# selective installation).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          # Vignettes require several Bioconductor packages listed in
          # Suggests; if these prove too slow or fragile in CI, consider
          # adding --no-build-vignettes here and testing vignettes in a
          # separate, Linux-only job instead.
          args: 'c("--no-manual")'
